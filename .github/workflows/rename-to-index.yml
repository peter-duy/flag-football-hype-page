name: Rename HTML to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "peter-duy"
          git config user.email "peter-duy@users.noreply.github.com"
          git mv flag-football-hype-page.html index.html
          git commit -m "Rename flag-football-hype-page.html to index.html"
          git push
